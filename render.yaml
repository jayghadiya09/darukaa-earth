services:
  - type: web
    name: darukaa-earth-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: FORCE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-earth-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.6"

databases:
  - name: darukaa-earth-db
    plan: free
    databaseName: darukaa_earth
    user: darukaa
